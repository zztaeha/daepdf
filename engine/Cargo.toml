[package]
name = "daepdf-engine"
version = "0.0.0"
edition = "2024"
publish = false
description = "daepdf's WebAssembly engine: daegun behind the byte protocol src/daegun/wasm/daegun.ts speaks"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
daegun = "=1.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
